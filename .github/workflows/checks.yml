name: Sinfall checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Game regression tests
        run: npm test
      - name: Source and asset checks
        run: npm run check
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phone UI and save verification
        run: node scripts/check-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sinfall-phone-browser-proof
          path: browser-proof/
          retention-days: 7
